services:
  - type: web
    name: zamukapay-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >
      python manage.py migrate --settings=zamukapay.settings.production &&
      python manage.py collectstatic --noinput --settings=zamukapay.settings.production &&
      gunicorn zamukapay.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: zamukapay.settings.production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
